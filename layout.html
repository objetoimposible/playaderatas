<!doctype html>
<html class="no-js" lang="$lang$">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$</title>
  <link rel="stylesheet" href="css/app.css">
</head>

<body>

  <nav>
    <ul class="menu">
      $nav-menu$
    </ul>
  </nav>

  <div class="grid-x">
    <div class="small-12 cell">


      <main>
        <header>
          <h1>$title$
            $if(date)$
            <sup class="subheader">$date$</sup>
            $endif$
          </h1>
         
        </header>
        <section>
          <hr/>
          $if(toc)$
          
          $toc$
          <hr/>
          $endif$
          $body$
        </section>
      </main>

    </div>
  </div>


  <footer>
    <h6><a target="_blank" href="https://github.com/objetoimposible/playaderatas"><b>Playa de ratas</b></a>.  Escrito en Markdown y compilado con <a target="_blank" href="https://pandoc.org/diagram.svgz?v=20260131160627">Pandoc</a> & <a href="https://gulpjs.com/">Gulp</a>/<a href="https://nodejs.org/en">Node</a></h6>

  </footer>


  <script src="js/jquery.min.js"></script>
  <script src="js/what-input.min.js"></script>
  <script src="js/foundation.min.js"></script>
  <script src="js/app.js"></script>

</body>








</body>

</html>
